version: '3'

vars:
  REPO_URL: 'https://github.com/nexu-io/open-design.git'
  PNPM_VERSION: '10.33.2'
  TARGET_DIR: '{{.TARGET_DIR | default "./build/open-design"}}'
  SOURCE_DIR: '{{.SOURCE_DIR | default "./open-design"}}'
  EXPORT_PATH: '{{.EXPORT_PATH | default "./open-design-sessions.tar.gz"}}'
  OD_VERSION: 7af539b89c981b23c74f1af78b38d351f56540f8

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  all:
    desc: "Run clone, build, export, and import tasks sequentially"
    cmds:
      - task: clone
      - task: build
      - task: export
      - task: import

  install-pnpm:
    desc: "Install pnpm if it is unavailable"
    run: once
    cmds:
      - |
        if ! timeout 10s env COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm --version &>/dev/null; then
          echo "[task install-pnpm] pnpm is unavailable. Installing pnpm..."
          if command -v corepack &>/dev/null; then
            echo "[task install-pnpm] Installing pnpm with Corepack..."
            corepack enable pnpm
            timeout 60s env COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack install --global pnpm@{{.PNPM_VERSION}}
          elif command -v npm &>/dev/null; then
            echo "[task install-pnpm] Installing pnpm via npm..."
            npm install -g pnpm
          elif command -v curl &>/dev/null; then
            echo "[task install-pnpm] Installing pnpm via standalone installer script..."
            curl -fsSL https://get.pnpm.io/install.sh | sh -
          else
            echo "Error: Unable to install pnpm automatically. Please install Node.js / npm manually." >&2
            exit 1
          fi
          if ! timeout 10s env COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm --version &>/dev/null; then
            echo "Error: pnpm installation completed but pnpm is still unavailable." >&2
            exit 1
          fi
        else
          echo "[task install-pnpm] pnpm is already installed."
        fi

  check-prereqs:
    desc: "Check if required prerequisites (aws, git, node, npm, pnpm, task, tar) are installed"
    run: once
    cmds:
      - |
        echo "[task check-prereqs] Checking prerequisites..."
        MISSING=0
        for cmd in aws git node npm pnpm task tar; do
          if command -v "$cmd" &>/dev/null; then
            if version=$(timeout 10s env COREPACK_ENABLE_DOWNLOAD_PROMPT=0 "$cmd" --version 2>&1); then
              echo "  [✓] $cmd: $(command -v "$cmd") ($(printf '%s\n' "$version" | head -n 1))"
            else
              echo "  [✗] $cmd: version check failed or timed out"
              MISSING=$((MISSING + 1))
            fi
          else
            echo "  [✗] $cmd: NOT FOUND"
            MISSING=$((MISSING + 1))
          fi
        done
        if [ "$MISSING" -gt 0 ]; then
          echo "Error: $MISSING prerequisite(s) missing." >&2
          exit 1
        fi
        echo "[task check-prereqs] All prerequisites satisfied."

  clone:
    desc: "Clone the open-design repository into TARGET_DIR"
    deps: [check-prereqs]
    cmds:
      - |
        if [ -d "{{.TARGET_DIR}}/.git" ]; then
          echo "[task clone] Target directory '{{.TARGET_DIR}}' already contains a git repository."
        else
          echo "[task clone] Cloning {{.REPO_URL}} into {{.TARGET_DIR}}..."
          mkdir -p "$(dirname "{{.TARGET_DIR}}")"
          git clone {{.REPO_URL}} "{{.TARGET_DIR}}"
          cd "{{.TARGET_DIR}}"
          git checkout "{{.OD_VERSION}}"
          echo "[task clone] Clone completed successfully."
        fi

  codeartifact-login:
    desc: "Authenticate npm with the oce-devops CodeArtifact repository"
    deps: [check-prereqs]
    status:
      - |
        REGISTRY=$(aws codeartifact get-repository-endpoint --domain oce-devops --repository npm --format npm --query repositoryEndpoint --output text 2>/dev/null)
        [ -n "$REGISTRY" ] && [ "$REGISTRY" != "None" ] && npm ping --registry="$REGISTRY" &>/dev/null
    cmds:
      - aws codeartifact login --tool npm --repository npm --domain oce-devops

  build:
    desc: "Build open-design inside TARGET_DIR"
    deps: [clone, codeartifact-login]
    dir: '{{.TARGET_DIR}}'
    cmds:
      - |
        echo "[task build] Building open-design inside {{.TARGET_DIR}}..."
        pnpm install
        if [ -f "apps/desktop/node_modules/electron/install.js" ]; then
          (cd apps/desktop && node node_modules/electron/install.js) || true
        fi
        if [ -f "apps/packaged/node_modules/electron/install.js" ]; then
          (cd apps/packaged && node node_modules/electron/install.js) || true
        fi
        echo "[task build] Build completed successfully."

  run:
    desc: "Run open-design inside TARGET_DIR"
    dir: '{{.TARGET_DIR}}'
    cmds:
      - |
        echo "[task run] Starting open-design inside {{.TARGET_DIR}}..."
        if [ -n "${DISPLAY:-}" ] || [ -n "${WAYLAND_DISPLAY:-}" ]; then
          pnpm tools-dev {{.APP | default ""}} --web-port 40123 --daemon-port 40124
        else
          echo "[task run] No display server detected (headless mode). Running daemon + web..."
          pnpm tools-dev run {{.APP | default "web"}} --web-port 40123 --daemon-port 40124
        fi

  export:
    desc: "Export sessions from local open-design instance to archive"
    cmds:
      - |
        SRC_OD=""
        if [ -d "{{.SOURCE_DIR}}/.od" ]; then
          SRC_OD="{{.SOURCE_DIR}}/.od"
        elif [ -d "$HOME/.od" ]; then
          SRC_OD="$HOME/.od"
        elif [ -d "./.od" ]; then
          SRC_OD="./.od"
        fi

        if [ -z "$SRC_OD" ]; then
          echo "Error: Unable to locate .od session directory in '{{.SOURCE_DIR}}', '$HOME/.od', or './.od'." >&2
          exit 1
        fi

        echo "[task export] Exporting sessions from $SRC_OD to {{.EXPORT_PATH}}..."
        mkdir -p "$(dirname "{{.EXPORT_PATH}}")"
        tar -czf "{{.EXPORT_PATH}}" -C "$(dirname "$SRC_OD")" "$(basename "$SRC_OD")"
        echo "[task export] Sessions exported successfully to {{.EXPORT_PATH}}."

  import:
    desc: "Import exported sessions into open-design instance at TARGET_DIR"
    cmds:
      - |
        if [ ! -f "{{.EXPORT_PATH}}" ]; then
          echo "Error: Export archive '{{.EXPORT_PATH}}' not found." >&2
          exit 1
        fi

        if [ ! -d "{{.TARGET_DIR}}" ]; then
          echo "Error: Target directory '{{.TARGET_DIR}}' does not exist. Run 'task clone' first." >&2
          exit 1
        fi

        echo "[task import] Importing session data into {{.TARGET_DIR}}/.od..."
        rm -rf "{{.TARGET_DIR}}/.od"
        tar -xzf "{{.EXPORT_PATH}}" -C "{{.TARGET_DIR}}"
        echo "[task import] Sessions imported successfully into {{.TARGET_DIR}}/.od."
